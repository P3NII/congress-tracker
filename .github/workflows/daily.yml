name: Morning congress-trade report

on:
  schedule:
    # 10:07 UTC on weekdays = 6:07 AM Atlantic / 5:07 AM Eastern in winter (an hour later in summer clock terms)
    - cron: "7 10 * * 1-5"
  workflow_dispatch: {}   # lets you click "Run workflow" by hand

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py
      - name: Save report and history
        run: |
          git config user.name "congress-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git commit -m "Report $(date -u +%F)" || echo "nothing new"
          git push
